<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Antrenman">
    
    <title>Antrenman Takip</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --primary: #5e5ce6;
            --success: #32d74b;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding-bottom: env(safe-area-inset-bottom, 90px); 
            padding-top: env(safe-area-inset-top, 0px);
        }

        .header { padding: 20px; font-size: 28px; font-weight: 800; border-bottom: 1px solid var(--border-color); background: var(--bg-color); position: sticky; top: 0; z-index: 10; }

        .tab-content { display: none; padding: 15px; padding-bottom: 100px; }
        .tab-content.active { display: block; }

        .exercise-card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 2px solid transparent; transition: all 0.3s; cursor: pointer; }
        .exercise-card.completed { border-color: var(--success); }
        .exercise-card.completed .ex-title { color: var(--success); }
        .ex-info h3 { font-size: 18px; margin-bottom: 6px; font-weight: 600; }
        .ex-info p { font-size: 14px; color: var(--text-muted); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border-color); z-index: 20; }
        .nav-item { color: var(--text-muted); text-align: center; font-size: 11px; font-weight: 600; cursor: pointer; padding: 6px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px;}
        .nav-item.active { color: var(--primary); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 50; display: none; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); width: 100%; height: 90vh; border-radius: 24px 24px 0 0; padding: 20px; overflow-y: auto; position: relative; animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));}
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; color: var(--text-muted); cursor: pointer; background: #2c2c2e; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; line-height: 0; font-weight: 300;}
        .modal-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; padding-right: 40px; margin-top: 10px;}
        
        .video-container { width: 100%; height: 220px; background: #000; border-radius: 16px; margin-bottom: 20px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-box { background: var(--bg-color); padding: 15px; border-radius: 14px; text-align: center; }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600;}
        .stat-value { font-size: 15px; font-weight: bold; color: var(--primary); }

        .weight-section { margin-bottom: 25px; background: var(--bg-color); padding: 15px; border-radius: 14px; }
        .weight-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .weight-row:last-child { margin-bottom: 0; }
        .weight-input { background: var(--card-bg); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 10px; width: 90px; text-align: center; font-size: 18px; outline: none; font-weight: bold;}
        .weight-input:focus { border-color: var(--primary); }

        .btn-complete { width: 100%; background: var(--text-main); color: black; padding: 18px; border: none; border-radius: 14px; font-size: 17px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-complete:active { opacity: 0.8; transform: scale(0.98); }

        /* History List */
        .history-item { background: var(--card-bg); padding: 16px; border-radius: 14px; margin-bottom: 12px; border-left: 4px solid var(--primary); }
        .history-date { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500;}
        .history-text { font-size: 15px; line-height: 1.4;}
        .history-empty { text-align: center; color: var(--text-muted); margin-top: 60px; font-size: 15px;}
    </style>
</head>
<body>

    <div class="header" id="main-title">Adaptasyon Programı</div>

    <!-- ADAPTASYON TAB -->
    <div id="tab-adaptation" class="tab-content active"></div>

    <!-- UPPER TAB -->
    <div id="tab-upper" class="tab-content"></div>

    <!-- LOWER TAB -->
    <div id="tab-lower" class="tab-content"></div>

    <!-- HISTORY TAB -->
    <div id="tab-history" class="tab-content">
        <div id="history-container"></div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">×</span>
            <div class="modal-title" id="m-title">Hareket Adı</div>
            
            <div class="video-container">
                <video id="m-video" loop muted playsinline controls></video>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label" id="m-label-1">ISINMA</div>
                    <div class="stat-value" id="m-stat-1">2 Set x 6 Tekrar</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label" id="m-label-2">ÇALIŞMA</div>
                    <div class="stat-value" id="m-stat-2">2 Set x 6-8 Tekrar</div>
                </div>
            </div>

            <div class="weight-section">
                <div class="weight-row" id="warmup-row">
                    <span style="font-size: 15px; font-weight: 500;">Isınma Ağırlığı (kg)</span>
                    <input type="number" id="m-warmup-weight" class="weight-input" placeholder="0" inputmode="decimal">
                </div>
                <div class="weight-row">
                    <span style="font-size: 15px; font-weight: 500;" id="work-label">Çalışma Ağırlığı (kg)</span>
                    <input type="number" id="m-work-weight" class="weight-input" placeholder="0" inputmode="decimal">
                </div>
            </div>

            <button class="btn-complete" onclick="completeExercise()">Tamamla ve Kaydet</button>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('adaptation', this)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            ADAPTASYON
        </div>
        <div class="nav-item" onclick="switchTab('upper', this)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-4"></path></svg>
            UPPER
        </div>
        <div class="nav-item" onclick="switchTab('lower', this)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
            LOWER
        </div>
        <div class="nav-item" onclick="switchTab('history', this)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            GEÇMİŞ
        </div>
    </div>

    <script>
        const exercises = {
            adaptation: [
                { id: "a1", name: "Chest Press Machine", vid: "chest_press.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true },
                { id: "a2", name: "Pec Deck Fly", vid: "pec_deck_fly.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true },
                { id: "a3", name: "Lat Pulldown", vid: "lat_pulldown.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true },
                { id: "a4", name: "Seated Row", vid: "seated_row.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true },
                { id: "a5", name: "Machine Shoulder Press", vid: "shoulder_press.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true },
                { id: "a6", name: "Lateral Raise", vid: "lateral_raise.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true },
                { id: "a7", name: "Cable Triceps Pushdown", vid: "triceps_pushdown.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true },
                { id: "a8", name: "Dumbell Curl", vid: "dumbbell_curl.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true },
                { id: "a9", name: "Leg Extension", vid: "leg_extension.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true },
                { id: "a10", name: "Leg Curl", vid: "leg_curl.mp4", sets: "3 Set", reps: "12 Tekrar", isAdaptation: true }
            ],
            upper: [
                { id: "u1", name: "Chest Press", vid: "chest_press.mp4" },
                { id: "u2", name: "Incline Chest Press", vid: "incline_chest_press.mp4" },
                { id: "u3", name: "Pec Deck Fly", vid: "pec_deck_fly.mp4" },
                { id: "u4", name: "Lat Pulldown", vid: "lat_pulldown.mp4" },
                { id: "u5", name: "Wide Grip Chest Supported Row", vid: "wide_grip_row.mp4" },
                { id: "u6", name: "T Bar Chest Supported Row", vid: "t_bar_row.mp4" },
                { id: "u7", name: "Shoulder Press", vid: "shoulder_press.mp4" },
                { id: "u8", name: "Lateral Raise", vid: "lateral_raise.mp4" },
                { id: "u9", name: "Biceps Curl", vid: "biceps_curl.mp4" },
                { id: "u10", name: "Triceps Pushdown", vid: "triceps_pushdown.mp4" }
            ],
            lower: [
                { id: "l1", name: "Hack Squat", vid: "hack_squat.mp4" },
                { id: "l2", name: "Leg Extension", vid: "leg_extension.mp4" },
                { id: "l3", name: "Leg Curl", vid: "leg_curl.mp4" },
                { id: "l4", name: "Hyper Extension", vid: "hyper_extension.mp4" },
                { id: "l5", name: "Abduction", vid: "abduction.mp4" },
                { id: "l6", name: "Adduction", vid: "adduction.mp4" },
                { id: "l7", name: "Calf Raise", vid: "calf_raise.mp4" }
            ]
        };

        let currentExerciseObj = null;

        function initApp() {
            renderList('adaptation');
            renderList('upper');
            renderList('lower');
            renderHistory();
        }

        function renderList(category) {
            const container = document.getElementById(`tab-${category}`);
            let html = '';
            exercises[category].forEach(ex => {
                const subText = ex.isAdaptation ? `${ex.sets} x ${ex.reps}` : 'Toplam 4 Set';
                html += `
                    <div class="exercise-card" id="card-${ex.id}" onclick="openModal('${category}', '${ex.id}')">
                        <div class="ex-info">
                            <h3 class="ex-title">${ex.name}</h3>
                            <p>${subText}</p>
                        </div>
                        <div style="font-size: 22px; color: #32d74b; display:none;" id="check-${ex.id}">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function switchTab(tab, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`tab-${tab}`).classList.add('active');
            element.classList.add('active');

            const titles = { adaptation: "Adaptasyon Programı", upper: "Upper (Üst Vücut)", lower: "Lower (Alt Vücut)", history: "Geçmiş & Takvim" };
            document.getElementById('main-title').innerText = titles[tab];

            if(tab === 'history') renderHistory();
        }

        function openModal(category, id) {
            const ex = exercises[category].find(e => e.id === id);
            if(!ex) return;
            currentExerciseObj = ex;

            document.getElementById('m-title').innerText = ex.name;
            
            const videoEl = document.getElementById('m-video');
            videoEl.src = `videolar/${ex.vid}`;
            videoEl.play().catch(e => console.log("Video autoplay engellendi"));

            const label1 = document.getElementById('m-label-1');
            const label2 = document.getElementById('m-label-2');
            const stat1 = document.getElementById('m-stat-1');
            const stat2 = document.getElementById('m-stat-2');
            const warmupRow = document.getElementById('warmup-row');
            const workLabel = document.getElementById('work-label');

            if (ex.isAdaptation) {
                label1.innerText = "SET HEDEFİ";
                label2.innerText = "TEKRAR HEDEFİ";
                stat1.innerText = ex.sets;
                stat2.innerText = ex.reps;
                warmupRow.style.display = 'none';
                workLabel.innerText = "Kullanılan Ağırlık (kg)";
            } else {
                label1.innerText = "ISINMA";
                label2.innerText = "ÇALIŞMA";
                stat1.innerText = "2 Set x 6 Tekrar";
                stat2.innerText = "2 Set x 6-8 Tekrar";
                warmupRow.style.display = 'flex';
                workLabel.innerText = "Çalışma Ağırlığı (kg)";
            }

            let savedData = JSON.parse(localStorage.getItem('appWeights')) || {};
            document.getElementById('m-warmup-weight').value = savedData[ex.id]?.warmup || '';
            document.getElementById('m-work-weight').value = savedData[ex.id]?.work || '';

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('m-video').pause();
            
            document.getElementById('m-warmup-weight').blur();
            document.getElementById('m-work-weight').blur();
        }

        function completeExercise() {
            if(!currentExerciseObj) return;

            const name = currentExerciseObj.name;
            const id = currentExerciseObj.id;
            const newWarmup = document.getElementById('m-warmup-weight').value;
            const newWork = document.getElementById('m-work-weight').value;

            let savedData = JSON.parse(localStorage.getItem('appWeights')) || {};
            let historyLog = JSON.parse(localStorage.getItem('appHistory')) || [];

            const oldWarmup = savedData[id]?.warmup || 0;
            const oldWork = savedData[id]?.work || 0;

            let changed = false;

            if(!currentExerciseObj.isAdaptation && newWarmup !== "" && newWarmup != oldWarmup) {
                historyLog.unshift({ date: new Date().toLocaleString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }), text: `${name} Isınma ağırlığı ${newWarmup} kg olarak güncellendi.` });
                changed = true;
            }
            if(newWork !== "" && newWork != oldWork) {
                const labelText = currentExerciseObj.isAdaptation ? "Ağırlığı" : "Çalışma ağırlığı";
                historyLog.unshift({ date: new Date().toLocaleString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }), text: `${name} ${labelText} ${newWork} kg olarak güncellendi.` });
                changed = true;
            }

            savedData[id] = { warmup: newWarmup, work: newWork };
            localStorage.setItem('appWeights', JSON.stringify(savedData));
            
            if(changed) {
                localStorage.setItem('appHistory', JSON.stringify(historyLog));
            }

            document.getElementById(`card-${id}`).classList.add('completed');
            document.getElementById(`check-${id}`).style.display = 'block';

            closeModal();
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            let historyLog = JSON.parse(localStorage.getItem('appHistory')) || [];

            if(historyLog.length === 0) {
                container.innerHTML = '<div class="history-empty">Henüz ağırlık geçmişi yok.<br>Ağırlık girdiğinizde burada listelenecek.</div>';
                return;
            }

            let html = '';
            historyLog.forEach(log => {
                html += `
                    <div class="history-item">
                        <div class="history-date">${log.date}</div>
                        <div class="history-text">${log.text}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        initApp();
    </script>
</body>
</html>
